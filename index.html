<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Album Rater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f1;--card:#ffffff;--card2:#f9f9f7;--tx:#18181b;--mut:#71717a;
  --ac:#c2410c;--ac-on:#ffffff;--bd:#e4e4e7;--sh:0 2px 10px rgba(0,0,0,.04);color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-ui]){
    --bg:#111113;--card:#1a1a1e;--card2:#222228;--tx:#f4f4f5;--mut:#a1a1aa;
    --ac:#fb923c;--ac-on:#111113;--bd:#2c2c33;--sh:0 4px 16px rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-ui="dark"]{--bg:#111113;--card:#1a1a1e;--card2:#222228;--tx:#f4f4f5;--mut:#a1a1aa;--ac:#fb923c;--ac-on:#111113;--bd:#2c2c33;--sh:0 4px 16px rgba(0,0,0,.35);color-scheme:dark}
:root[data-ui="oled"]{--bg:#000000;--card:#0c0c0e;--card2:#151519;--tx:#f4f4f5;--mut:#8e8e98;--ac:#a3e635;--ac-on:#0b0b0b;--bd:#222228;--sh:none;color-scheme:dark}
:root[data-ui="light"]{--bg:#f4f4f1;--card:#ffffff;--card2:#f9f9f7;--tx:#18181b;--mut:#71717a;--ac:#c2410c;--ac-on:#ffffff;--bd:#e4e4e7;--sh:0 2px 10px rgba(0,0,0,.04);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(114px + env(safe-area-inset-bottom,0px))}
body.studio-mode{padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
body.clean-shot{padding:32px 14px}
body.clean-shot .hide-clean{display:none!important}
.wrap{max-width:680px;margin:0 auto}
.wrap.wide{max-width:1080px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 13px;transition:transform .12s,border-color .15s,background .15s,opacity .15s}
button:active{transform:scale(.98)}
button.primary{background:var(--ac);color:var(--ac-on);border-color:var(--ac);font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--mut);padding:7px 10px}
button.ghost:hover{color:var(--tx);background:var(--card2)}
button.icon-btn{padding:8px 11px;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:15px;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
textarea{resize:vertical;line-height:1.45}
select.compact-sel{width:auto;padding:7px 10px;font-size:12.5px;border-radius:9px;background:var(--card)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.top-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--mut)}
.sync-dot.ok{background:#22c55e}.sync-dot.dirty{background:#f59e0b}.sync-dot.err{background:#ef4444}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.drop-area{border:1.5px dashed var(--bd);border-radius:12px;padding:11px 12px;background:var(--card2);transition:border-color .15s,background .15s}
.drop-area.over{border-color:var(--ac);background:var(--card)}
.drop-area textarea{background:transparent;border:none;padding:2px 0;min-height:68px;font-size:15px}
.drop-area textarea:focus{border-color:transparent}
.subtle-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:5px 10px;border-radius:8px;background:var(--card);border:1px solid var(--bd);color:var(--mut);font-weight:500}
.chip:hover{color:var(--tx);border-color:var(--mut)}
.ctx-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ctx-actions button{flex:1;min-width:120px}
.status-msg{font-size:13px;color:var(--mut);margin-top:8px;min-height:16px}
.status-msg.err{color:#ef4444}
.manual-grid{display:grid;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:500px){.row2{grid-template-columns:1fr}}

.sec-lbl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:14px 2px 8px}
.alb-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--sh);transition:border-color .15s}
.alb-item:hover{border-color:var(--mut)}
.alb-click{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
.alb-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--card2);flex-shrink:0;border:1px solid var(--bd)}
.alb-meta{min-width:0;flex:1}.alb-title{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}.alb-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.alb-btns{display:flex;align-items:center;gap:4px;flex-shrink:0}
.cand{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;margin-top:6px;background:var(--card2)}
.cand img,.cand .ph{width:44px;height:44px;border-radius:7px;object-fit:cover;background:var(--card);flex-shrink:0}
.cand-info{min-width:0;flex:1}.cand-t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cand-s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rate-head{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px 13px;margin-bottom:10px}
.rate-head .alb-thumb{width:52px;height:52px;cursor:pointer}
.rate-info{flex:1;min-width:0;cursor:pointer}.rate-artist{font-size:12.5px;color:var(--mut);font-weight:500}.rate-album{font-size:16px;font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.t-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:7px;scroll-margin-top:12px;transition:border-color .15s}
.t-card.un{border-left:3px solid var(--bd)}.t-card.act{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.t-card.cl{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}.t-card.cl:hover{border-color:var(--mut)}
.t-left{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.t-idx{font-family:'DM Mono',monospace;font-size:12px;color:var(--mut);min-width:20px}
.t-nm{font-weight:500;font-size:14.5px;overflow-wrap:anywhere}
.t-bdg{font-family:'DM Mono',monospace;font-weight:700;font-size:14.5px;color:var(--ac);min-width:40px;text-align:right;flex-shrink:0}
.t-card.un .t-bdg{color:var(--mut);font-weight:400}
.t-act-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.t-act-top .t-nm{font-weight:600;font-size:15px}
.kpad1,.kpad2{display:flex;gap:6px;margin-top:10px}
.kpad1 button{flex:1;aspect-ratio:1;max-width:48px;min-height:42px;border-radius:50%;padding:0;font-size:15.5px;font-weight:600}
.kpad2 button{flex:1;height:44px;border-radius:22px;padding:0;font-size:15px;font-weight:600}
.kpad2 .bk{flex:0 0 44px;border-radius:50%;color:var(--mut)}
.kpad1 button.on,.kpad2 button.on{background:var(--ac);color:var(--ac-on);border-color:var(--ac)}
.rate-add-bar{display:flex;gap:8px;margin-bottom:10px}.rate-add-bar input{flex:1;font-size:14px;padding:8px 11px}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.foot-in{max-width:680px;margin:0 auto}
.foot-avg{font-size:13.5px;color:var(--mut);margin-bottom:8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.foot-avg b{font-size:19px;color:var(--ac);font-family:'DM Mono',monospace}
.foot-btns{display:flex;gap:8px}.foot-btns button{flex:1;padding:10px 12px;font-size:14px}

#drag-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;pointer-events:none}
#drag-overlay.show{display:flex}
.drag-box{border:2px dashed #fff;border-radius:20px;padding:34px 40px;text-align:center;color:#fff;max-width:420px;background:rgba(20,20,24,.78)}
.drag-box h2{margin:0 0 6px;font-size:20px}.drag-box p{margin:0;opacity:.78;font-size:14px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.modal-hd h2{margin:0;font-size:17px}
.set-grp{padding:11px 0;border-top:1px solid var(--bd)}.set-grp:first-of-type{border-top:none;padding-top:0}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}
.set-lbl{font-size:14px;font-weight:500}.set-sub{font-size:12px;color:var(--mut);margin-top:2px}
.set-ctrl{flex-shrink:0}.set-ctrl select,.set-ctrl input[type=number]{width:auto;min-width:120px;padding:6px 10px;font-size:13.5px}
.switch{position:relative;width:42px;height:24px;display:inline-block}.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--bd);border-radius:999px;cursor:pointer;transition:.18s}
.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+.slider{background:var(--ac)}.switch input:checked+.slider:before{transform:translateX(18px)}
.cover-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.cover-opt{padding:0;border-radius:8px;overflow:hidden;border:2px solid transparent;aspect-ratio:1}
.cover-opt:hover{border-color:var(--ac)}.cover-opt img{width:100%;height:100%;object-fit:cover;display:block}
.edit-tr-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}.edit-tr-row input{padding:7px 10px;font-size:14px}

.studio-stage{display:flex;justify-content:center;align-items:flex-start;margin:8px 0 18px}
.clean-exit{position:fixed;top:12px;right:12px;z-index:50;opacity:.35;font-size:12px;padding:6px 10px}.clean-exit:hover{opacity:1}
.studio-panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.studio-tabs{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab-pills{display:flex;gap:6px}.tab-pills button.active{background:var(--ac);color:var(--ac-on);border-color:var(--ac);font-weight:600}
.lay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:6px}
.lay-btn{padding:8px 8px;font-size:12px;font-weight:500;text-align:center;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:3px}
.lay-btn.active{background:var(--ac);color:var(--ac-on);border-color:var(--ac);font-weight:600}.lay-ico{font-size:15px;line-height:1}
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.th-btn{padding:7px 8px;font-size:11.5px;font-weight:500;display:flex;align-items:center;gap:7px;border-radius:9px;text-align:left}
.th-btn.active{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset;font-weight:700}
.th-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid rgba(128,128,128,.35)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#18181b;color:#fff;padding:9px 15px;border-radius:999px;font-size:13px;font-weight:500;z-index:120;box-shadow:0 6px 24px rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .18s}
.toast.show{opacity:1}
</style>

<style id="card-styles">
.card-root,.card-root *{box-sizing:border-box}
.card-root{
  --c-bg:#141418;--c-solid-bg:#141418;--c-surface:rgba(255,255,255,0.06);--c-surface-2:rgba(255,255,255,0.105);
  --c-border:rgba(255,255,255,0.12);--c-text:#f4f4f5;--c-muted:rgba(244,244,245,0.62);
  --c-accent:#fb923c;--c-accent-ink:#111111;--c-hi-bg:rgba(251,146,60,0.20);--c-hi-bd:rgba(251,146,60,0.58);
  background:var(--c-bg);color:var(--c-text);border:1px solid var(--c-border);border-radius:18px;
  padding:26px;width:100%;max-width:860px;position:relative;overflow:hidden;
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35;
  box-shadow:0 24px 60px rgba(0,0,0,.35)
}
.c-mono{font-family:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.c-disp{font-family:'Syne','Inter',system-ui,sans-serif}
.c-cover{display:block;object-fit:cover;border-radius:12px;background:var(--c-surface-2);flex-shrink:0;border:1px solid var(--c-border)}
.c-artist{font-size:13.5px;font-weight:600;color:var(--c-muted);letter-spacing:.02em}
.c-album{font-size:23px;font-weight:800;color:var(--c-text);line-height:1.16}
.c-year{font-weight:500;color:var(--c-muted);font-size:.80em;margin-left:6px}
.c-header-inline{font-size:21px;font-weight:700;color:var(--c-text);line-height:1.22}
.c-header-inline .art{color:var(--c-accent);font-weight:700}.c-header-inline .sep{color:var(--c-muted);margin:0 6px;font-weight:400}.c-header-inline .yr{color:var(--c-muted);font-weight:500;font-size:.84em;margin-left:6px}
.c-avg-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--c-muted)}
.c-avg-val{font-family:'DM Mono',ui-monospace,monospace;font-weight:700;font-variant-numeric:tabular-nums;color:var(--c-accent);line-height:1}
.c-avg-box{padding:11px 15px;border-radius:12px;background:var(--c-surface-2);border:1px solid var(--c-border);display:flex;align-items:baseline;justify-content:space-between;gap:14px}

.t-row{display:flex;align-items:center;gap:10px;min-width:0;transition:opacity .15s}
.t-num{font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;color:var(--c-muted);width:20px;flex-shrink:0;text-align:right}
.t-title{flex:1;min-width:0;font-size:13.5px;font-weight:500;color:var(--c-text);overflow-wrap:anywhere}
.t-score{font-family:'DM Mono',ui-monospace,monospace;font-weight:700;font-size:15px;flex-shrink:0;text-align:right;min-width:38px}
.t-pick{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--c-hi-bg);color:var(--c-accent);border:1px solid var(--c-hi-bd);flex-shrink:0}
.t-dot-hi{width:6px;height:6px;border-radius:50%;background:var(--c-accent);flex-shrink:0}

/* 6 High-Separation Highlight Modes */
.hl-spotlight .t-row.dim{opacity:0.40}
.hl-spotlight .t-row.hi .t-title{font-weight:700}

.hl-framed .t-row.hi{background:var(--c-surface-2)!important;border:1.5px solid var(--c-hi-bd)!important;box-shadow:0 3px 12px rgba(0,0,0,.14);border-radius:9px}
.hl-framed .t-row.dim{background:transparent!important;border-color:transparent!important;opacity:0.78}

.hl-wash .t-row.hi{background:var(--c-hi-bg)!important;border:1px solid var(--c-hi-bd)!important;border-radius:9px}
.hl-wash .t-row.hi .t-title{font-weight:700}
.hl-wash .t-row.dim{opacity:0.72}

.hl-stripeTag .t-row.hi{box-shadow:inset 4px 0 0 var(--c-accent);background:var(--c-surface-2)!important;border-radius:8px}
.hl-stripeTag .t-row.hi .t-title{font-weight:700}
.hl-stripeTag .t-row.dim{opacity:0.58}

.hl-scorePill .t-row.hi .t-score{background:var(--c-accent);color:var(--c-accent-ink)!important;padding:2px 8px;border-radius:7px;font-size:13.5px}
.hl-scorePill .t-row.hi{border-bottom:1.5px solid var(--c-hi-bd)!important}
.hl-scorePill .t-row.dim{opacity:0.62}

.hl-grp-hd{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c-accent);margin:8px 2px 5px;display:flex;align-items:center;gap:8px}
.hl-grp-hd.muted{color:var(--c-muted);margin-top:12px}
.hl-grp-hd::after{content:"";flex:1;height:1px;background:var(--c-border)}

.c-extras{margin-top:14px;padding-top:12px;border-top:1px solid var(--c-border);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:12px;color:var(--c-muted)}
.c-extras b{color:var(--c-text);font-weight:600}
.c-note{width:100%;font-size:12.5px;color:var(--c-text);opacity:.88;font-style:italic;line-height:1.45}
.c-dist{display:flex;align-items:center;gap:4px;height:12px}.c-dist span{display:inline-block;height:100%;border-radius:2px;min-width:4px}

/* 1. SIDE BY SIDE */
.lay-side{max-width:820px}
.lay-side .s-grid{display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start}
.lay-side .s-left{display:flex;flex-direction:column;gap:12px}
.lay-side .c-cover{width:100%;aspect-ratio:1}
.lay-side .c-avg-val{font-size:28px}
.lay-side .s-list{display:flex;flex-direction:column;gap:5px}
.lay-side .t-row{padding:7px 11px;border-radius:9px;background:var(--c-surface);border:1px solid var(--c-border)}
@media(max-width:640px){.lay-side .s-grid{grid-template-columns:1fr}.lay-side .c-cover{max-width:220px}}

/* 2. CENTERED (Cohesive surface Average + Hero Cover) */
.lay-center{max-width:560px}
.lay-center .cen-top{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:20px}
.lay-center .c-cover{width:265px;height:265px;border-radius:16px;margin-bottom:16px;box-shadow:0 14px 36px rgba(0,0,0,.28)}
.lay-center .cen-list{display:flex;flex-direction:column;gap:5px}
.lay-center .t-row{padding:8px 13px;border-radius:10px;background:var(--c-surface);border:1px solid var(--c-border)}
.lay-center .cen-foot{margin-top:14px}
.lay-center .c-avg-box{justify-content:center;gap:14px;padding:12px 20px}
.lay-center .c-avg-val{font-size:28px}

/* 3. SHOWCASE (Harmonious Meta Card + Spacious Left Column) */
.lay-showcase{max-width:840px}
.lay-showcase .sh-grid{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
.lay-showcase .sh-left{display:flex;flex-direction:column;gap:12px}
.lay-showcase .c-cover{width:100%;aspect-ratio:1;border-radius:14px}
.lay-showcase .sh-meta{padding:18px;border-radius:14px;background:var(--c-surface-2);border:1px solid var(--c-border);display:flex;flex-direction:column;gap:6px}
.lay-showcase .sh-meta .c-artist{font-size:14px;color:var(--c-accent);text-transform:uppercase;letter-spacing:.08em}
.lay-showcase .sh-meta .c-album{font-size:26px;line-height:1.15}
.lay-showcase .sh-right{display:flex;flex-direction:column;gap:10px}
.lay-showcase .sh-tracks{display:flex;flex-direction:column;gap:5px}

<body>
<div id="app"></div>
<div id="drag-overlay"><div class="drag-box"><h2>Drop Album Folder or Audio Files</h2><p>Reads Artist, Album, Year, Tracklist &amp; Cover locally</p></div></div>
<div id="toast" class="toast"></div>

<script>
(function(){
"use strict";

/* ═════════════ STORAGE, SETTINGS & SYNC STATE ═════════════ */
const STORE_KEY = "album-rater-studio-v1";
const DEFAULT_SETTINGS = {
  uiTheme: "auto", cardLayout: "side", cardTheme: "midnight",
  showYear: true, highlightEnabled: false, highlightThreshold: 3.5, highlightStyle: "spotlight",
  scoreColorMode: "semantic", decimalMode: "clean", sortMode: "track",
  showBestTrack: false, showDate: false, showDistribution: false, showNote: false,
  pngRatio: "auto", syncToken: "", syncGistId: ""
};
let db = { albums: [], deleted: [], openId: null, view: "home", dirty: false, lastSync: 0, settings: { ...DEFAULT_SETTINGS } };
let syncStatus = "idle"; // idle | syncing | ok | err

function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && Array.isArray(p.albums)){
        db.albums = p.albums; db.deleted = Array.isArray(p.deleted) ? p.deleted : [];
        db.openId = p.openId || null; db.view = p.view || "home";
        db.dirty = !!p.dirty; db.lastSync = p.lastSync || 0;
        db.settings = { ...DEFAULT_SETTINGS, ...(p.settings || {}) };
        return;
      }
    }
    const oldRaw = localStorage.getItem("album-rating-v2");
    if(oldRaw){
      const old = JSON.parse(oldRaw);
      if(old && Array.isArray(old.albums) && old.albums.length){
        db.albums = old.albums.map(a => {
          const sp = splitArtistAlbum(a.name || "Album");
          return { id: String(a.id || Date.now() + Math.random()), artist: sp.artist, album: sp.album, year: sp.year, cover: "", note: "", auto: !!a.auto, createdAt: a.id || Date.now(), updatedAt: Date.now(), songs: (a.songs || []).map(s => ({ n: stripExt(s.n || ""), s: s.s })) };
        });
        saveDB(false);
      }
    }
  }catch(e){}
}

function saveDB(markDirty = true){
  if(markDirty && db.settings.syncToken) db.dirty = true;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch(e){ toast("Storage full — export backup or clear old covers"); }
}

function touchAlbum(a){ if(a) a.updatedAt = Date.now(); }

function applyUITheme(){
  const t = db.settings.uiTheme || "auto", r = document.documentElement;
  if(t === "auto") r.removeAttribute("data-ui"); else r.setAttribute("data-ui", t);
}

/* ═════════════ GITHUB GIST TWO-WAY SYNC (OFFLINE-SAFE) ═════════════ */
const GIST_LIB_FILE = "album-rater-library.json";
const GIST_COV_FILE = "album-rater-covers.json";

async function ghFetch(path, token, opts = {}){
  const headers = { "Accept": "application/vnd.github+json", "Authorization": "Bearer " + token.trim() };
  if(opts.body) headers["Content-Type"] = "application/json";
  const r = await fetch("https://api.github.com" + path, { ...opts, headers, cache: "no-store" });
  if(!r.ok){
    let msg = `GitHub HTTP ${r.status}`;
    try{ const j = await r.json(); if(j && j.message) msg = j.message; }catch(e){}
    throw new Error(msg);
  }
  return await r.json();
}

async function readGistFileContent(fileObj){
  if(!fileObj) return null;
  if(!fileObj.truncated && typeof fileObj.content === "string") return fileObj.content;
  if(fileObj.raw_url){
    const r = await fetch(fileObj.raw_url, { cache: "no-store" });
    if(r.ok) return await r.text();
  }
  return null;
}

async function ensureSyncGist(token){
  if(db.settings.syncGistId) return db.settings.syncGistId;
  const list = await ghFetch("/gists?per_page=50", token);
  const found = (list || []).find(g => g.files && g.files[GIST_LIB_FILE]);
  if(found){ db.settings.syncGistId = found.id; saveDB(false); return found.id; }
  const created = await ghFetch("/gists", token, {
    method: "POST",
    body: JSON.stringify({
      description: "Album Rater Sync Vault",
      public: false,
      files: {
        [GIST_LIB_FILE]: { content: JSON.stringify({ v: 1, albums: [], deleted: [] }) },
        [GIST_COV_FILE]: { content: "{}" }
      }
    })
  });
  db.settings.syncGistId = created.id;
  saveDB(false);
  return created.id;
}

async function syncWithGist(){
  const token = (db.settings.syncToken || "").trim();
  if(!token){ toast("Configure GitHub Token in Settings first"); return; }
  if(syncStatus === "syncing") return;
  syncStatus = "syncing"; render();
  try{
    const gistId = await ensureSyncGist(token);
    const gist = await ghFetch(`/gists/${gistId}`, token);
    const libStr = await readGistFileContent(gist.files && gist.files[GIST_LIB_FILE]);
    const covStr = await readGistFileContent(gist.files && gist.files[GIST_COV_FILE]);
    const remLib = libStr ? JSON.parse(libStr) : { albums: [], deleted: [] };
    const remCov = covStr ? JSON.parse(covStr) : {};

    // Build unified deletion map (newest tombstone per id)
    const delMap = new Map();
    [...(db.deleted || []), ...(remLib.deleted || [])].forEach(d => {
      if(!d || !d.id) return;
      const prev = delMap.get(d.id) || 0;
      if((d.at || 0) > prev) delMap.set(d.id, d.at || 0);
    });

    // Build album map by id
    const albMap = new Map();
    const putAlb = (src, isRemote) => {
      if(!src || !src.id) return;
      const upd = src.updatedAt || src.createdAt || 0;
      const delAt = delMap.get(src.id) || 0;
      if(delAt > upd) return; // Deleted more recently
      const cover = src.cover || (isRemote ? (remCov[src.id] || "") : "");
      const normSrc = { ...src, cover, updatedAt: upd };
      const cur = albMap.get(src.id);
      if(!cur){ albMap.set(src.id, normSrc); return; }
      const win = upd >= (cur.updatedAt || 0) ? normSrc : cur;
      const lose = win === normSrc ? cur : normSrc;
      albMap.set(src.id, { ...win, cover: win.cover || lose.cover || "" });
    };

    db.albums.forEach(a => putAlb(a, false));
    (remLib.albums || []).forEach(a => putAlb(a, true));

    const mergedAlbums = [...albMap.values()].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    const cutoff = Date.now() - 90 * 86400000;
    const mergedDeleted = [...delMap.entries()].filter(([, at]) => at > cutoff).map(([id, at]) => ({ id, at }));

    // Separate text metadata & dataURL covers cleanly so library JSON stays tiny
    const remoteAlbumsClean = mergedAlbums.map(a => {
      const c = { ...a };
      if(c.cover && c.cover.startsWith("data:")) c.cover = "";
      return c;
    });
    const remoteCovers = {};
    mergedAlbums.forEach(a => {
      if(a.cover && a.cover.startsWith("data:") && a.cover.length < 180000) remoteCovers[a.id] = a.cover;
    });

    await ghFetch(`/gists/${gistId}`, token, {
      method: "PATCH",
      body: JSON.stringify({
        files: {
          [GIST_LIB_FILE]: { content: JSON.stringify({ v: 1, albums: remoteAlbumsClean, deleted: mergedDeleted }) },
          [GIST_COV_FILE]: { content: JSON.stringify(remoteCovers) }
        }
      })
    });

    // Only commit merged state locally AFTER remote PATCH succeeded
    db.albums = mergedAlbums;
    db.deleted = mergedDeleted;
    db.dirty = false;
    db.lastSync = Date.now();
    if(db.openId && !curAlbum()) db.openId = null;
    saveDB(false);
    syncStatus = "ok";
    toast(`Synced (${mergedAlbums.length} albums)`);
  }catch(e){
    syncStatus = "err";
    toast("Sync failed (kept local): " + (e.message || "Network error"), 3400);
  }
  render();
}

/* ═════════════ UTILITIES ═════════════ */
const AUDIO_EXT = /\.(mp3|m4a|m4b|mp4|flac|wav|wave|aac|ogg|oga|opus|wma|alac|aif|aiff|ape|wv|mka)\s*$/i;
const stripExt = s => String(s || "").replace(AUDIO_EXT, "");
const norm = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/&/g, " and ").replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\bthe\b/g, " ").replace(/\s+/g, " ").trim();
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined && text !== null) e.textContent = String(text); return e; }
let toastT = null;
function toast(msg, ms = 2400){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms); }
function copyText(txt, okMsg){
  const fb = () => { const ta = document.createElement("textarea"); ta.value = txt; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); let ok = false; try{ ok = document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); toast(ok ? (okMsg || "Copied") : "Copy failed"); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(okMsg || "Copied"), fb); else fb();
}
function cleanTrackLine(l){
  l = String(l || "").replace(/\r/g, "").trim();
  if(!l || /^total\s+(playing\s+)?(time|length)/i.test(l)) return "";
  if(/^"?[A-Za-z]:[\\\/]/.test(l)) l = l.replace(/^"?.*[\\\/]/, "").replace(/"$/, "");
  l = l.replace(/^\d{1,3}(\s*[.)]\s*|\s*[:\-–]\s+|\s*\t\s*)/, "");
  const cells = l.split("\t").map(x => x.trim()).filter(Boolean);
  l = cells.length ? cells[0] : "";
  l = l.replace(/\s+show lyrics\s*$/i, "").replace(/\s*[(\[]?\d{1,2}:\d{2}(:\d{2})?[)\]]?\s*$/, "").replace(/^["“”]+|["“”]+$/g, "").trim();
  return stripExt(l).trim();
}
function splitArtistAlbum(line){
  let s = String(line || "").replace(/^["“”]+|["“”]+$/g, "").trim(), year = "";
  const ym = s.match(/[\(\[]\s*((?:19|20)\d{2})\s*[\)\]]\s*$/);
  if(ym){ year = ym[1]; s = s.slice(0, ym.index).trim(); }
  const m = s.match(/^(.+?)\s+[—–-]\s+(.+)$/); if(m) return { artist: m[1].trim(), album: m[2].trim(), year };
  const by = s.match(/^(.+?)\s+by\s+(.+)$/i); if(by) return { artist: by[2].trim(), album: by[1].trim(), year };
  const col = s.match(/^([^:]+):\s+(.+)$/); if(col) return { artist: col[1].trim(), album: col[2].trim(), year };
  return { artist: "", album: s, year };
}
function formatAlbumTitle(a, withYear){
  const m = a.artist ? `${a.artist} — ${a.album || "Untitled"}` : (a.album || "Untitled Album");
  return (withYear && a.year) ? `${m} (${a.year})` : m;
}
function fmtScore(s){

function encodePayload(obj){

}
function decodePayload(str){
  const b64 = str.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((str.length + 3) % 4);
  const bin = atob(b64), bytes = new Uint8Array(bin.length);

  return JSON.parse(new TextDecoder().decode(bytes));
}
function buildTransferText(a){

    const nm = s.n || `Track ${i + 1}`; return s.s === null ? nm : `${nm} | ${s.s}`;

}
function buildShareLink(a){

}
function tryParseLink(txt){

}

function findMatchingAlbum(inc){

const coverMatchCache = new Map();
function extractCoverPalette(src){
  if(!src || src.startsWith("data:image/svg")) return Promise.resolve(null);
  if(coverMatchCache.has(src)) return Promise.resolve(coverMatchCache.get(src));
  return new Promise(res => {
    const img = new Image(); if(!src.startsWith("data:")) img.crossOrigin = "anonymous";
    img.onload = () => {
      try{
        const cv = document.createElement("canvas"); cv.width = 24; cv.height = 24;
        const ctx = cv.getContext("2d"); ctx.drawImage(img, 0, 0, 24, 24);
        const d = ctx.getImageData(0, 0, 24, 24).data;
        let rS = 0, gS = 0, bS = 0, c = 0, vib = [56, 189, 248], bs = -1;
        for(let i = 0; i < d.length; i += 4){
          const r = d[i], g = d[i+1], b = d[i+2]; rS += r; gS += g; bS += b; c++;
          const mx = Math.max(r, g, b), mn = Math.min(r, g, b), sat = mx ? (mx - mn) / mx : 0, lum = (0.299*r + 0.587*g + 0.114*b) / 255;
          const sc = sat * (1 - Math.abs(lum - 0.58)); if(sc > bs){ bs = sc; vib = [r, g, b]; }
        }
        const ar = Math.round(rS/c), ag = Math.round(gS/c), ab = Math.round(bS/c);
        const solidBg = `rgb(${Math.round(ar*.14+6)},${Math.round(ag*.14+6)},${Math.round(ab*.14+8)})`;
        const bg1 = `rgb(${Math.round(ar*.18+8)},${Math.round(ag*.18+8)},${Math.round(ab*.18+10)})`;
        const bg2 = `rgb(${Math.round(ar*.28+14)},${Math.round(ag*.28+14)},${Math.round(ab*.28+18)})`;
        let [vr, vg, vb] = vib; const vL = .299*vr + .587*vg + .114*vb;
        if(vL < 120){ const b = (145 - vL) / 255; vr = Math.min(255, Math.round(vr + (255-vr)*b)); vg = Math.min(255, Math.round(vg + (255-vg)*b)); vb = Math.min(255, Math.round(vb + (255-vb)*b)); }
        const acHex = "#" + [vr, vg, vb].map(x => x.toString(16).padStart(2, "0")).join("");
        const pal = makeTheme("coverMatch", "Cover Match", `linear-gradient(145deg,${bg1},${bg2})`, solidBg, acHex, (.299*vr+.587*vg+.114*vb) > 155 ? "#111111" : "#ffffff", false);
        coverMatchCache.set(src, pal); res(pal);
      }catch(e){ res(null); }
    };
    img.onerror = () => res(null); img.src = src;
  });
}

function getScoreColor(s, theme){
  if(s === null || s === "?" || s === undefined) return theme.vars["--c-muted"];
  const m = db.settings.scoreColorMode;
  if(m === "mono") return theme.vars["--c-text"];
  if(m === "accent") return theme.vars["--c-accent"];
  if(theme.isLight) return s >= 4.5 ? "#15803d" : s >= 3.5 ? "#4d7c0f" : s >= 2.5 ? "#b45309" : s >= 1.5 ? "#c2410c" : "#dc2626";
  return s >= 4.5 ? "#4ade80" : s >= 3.5 ? "#a3e635" : s >= 2.5 ? "#facc15" : s >= 1.5 ? "#fb923c" : "#f87171";
}

const dataUrlCache = new Map();
async function toInlineDataUrl(src){
  if(!src || src.startsWith("data:")) return src;
  if(dataUrlCache.has(src)) return dataUrlCache.get(src);
  try{
    const r = await fetch(src, { mode: "cors" }); if(!r.ok) throw 0;
    const blob = await r.blob();
    const du = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
    dataUrlCache.set(src, du); return du;
  }catch(e){ return null; }
}

async function renderCardPngBlob(a){
  const ratio = db.settings.pngRatio || "auto";
  const layObj = CARD_LAYOUTS.find(l => l.id === db.settings.cardLayout) || CARD_LAYOUTS[0];
  const theme = await resolveThemeForAlbum(a);

  // Target width independent of current device screen size
  let targetW = layObj.w;
  if(ratio === "portrait") targetW = 480;
  else if(ratio === "square") targetW = Math.min(layObj.w, 680);
  else if(ratio === "post") targetW = Math.min(layObj.w, 620);
  else if(ratio === "wide") targetW = Math.max(layObj.w, 860);

  // Measure cleanly offscreen at exact targetW
  const sandbox = document.createElement("div");
  sandbox.style.cssText = `position:fixed;left:-9999px;top:0;width:${targetW}px;visibility:hidden;pointer-events:none;z-index:-1`;
  const card = buildCardDOM(a, theme);
  card.style.maxWidth = "none";
  card.style.width = targetW + "px";
  card.style.boxShadow = "none";
  sandbox.appendChild(card);
  document.body.appendChild(sandbox);

  const cw = Math.ceil(card.getBoundingClientRect().width);
  const ch = Math.ceil(card.getBoundingClientRect().height);
  document.body.removeChild(sandbox);

  for(const img of card.querySelectorAll("img")){
    const src = img.getAttribute("src");
    if(src && !src.startsWith("data:")){
      const du = await toInlineDataUrl(src);
      if(du) img.setAttribute("src", du); else throw new Error("CORS");
    }
  }

  const wrap = document.createElement("div"); wrap.setAttribute("xmlns", "http://www.w3.org/1999/xhtml"); wrap.appendChild(card);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${cw}" height="${ch}"><style>${document.getElementById("card-styles").textContent.replace(/</g, "&lt;")}</style><foreignObject width="100%" height="100%">${new XMLSerializer().serializeToString(wrap)}</foreignObject></svg>`;
  const im = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Render failed"));
    i.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });

  const sc = 2;
  let outW = cw, outH = ch;
  const pad = 44;
  if(ratio === "square"){ const s = Math.max(cw, ch) + pad * 2; outW = s; outH = s; }
  else if(ratio === "portrait"){ outW = Math.max(cw + pad * 2, Math.ceil((ch + pad * 2) * (9 / 16))); outH = Math.ceil(outW * (16 / 9)); if(outH < ch + pad * 2){ outH = ch + pad * 2; outW = Math.ceil(outH * (9 / 16)); } }
  else if(ratio === "post"){ outW = Math.max(cw + pad * 2, Math.ceil((ch + pad * 2) * 0.8)); outH = Math.ceil(outW * 1.25); if(outH < ch + pad * 2){ outH = ch + pad * 2; outW = Math.ceil(outH * 0.8); } }
  else if(ratio === "wide"){ outH = Math.max(ch + pad * 2, Math.ceil((cw + pad * 2) * (9 / 16))); outW = Math.ceil(outH * (16 / 9)); if(outW < cw + pad * 2){ outW = cw + pad * 2; outH = Math.ceil(outW * (9 / 16)); } }

  const cv = document.createElement("canvas"); cv.width = outW * sc; cv.height = outH * sc;
  const ctx = cv.getContext("2d"); ctx.scale(sc, sc);
  if(ratio !== "auto"){
    ctx.fillStyle = theme.solidBg || "#111113";
    ctx.fillRect(0, 0, outW, outH);
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.42)"; ctx.shadowBlur = 32; ctx.shadowOffsetY = 12;
    ctx.drawImage(im, Math.round((outW - cw) / 2), Math.round((outH - ch) / 2), cw, ch);
    ctx.restore();
  }else{
    ctx.drawImage(im, 0, 0, cw, ch);
  }
  return await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error("PNG failed")), "image/png"));
}

function openPasteScoresModal(a){
  openModal("Paste Scores", mod => {
    mod.appendChild(el("div", "set-sub", "Paste scores one per line (e.g. 4.25, 5, ?) or Track | Score lines."));
    const ta = el("textarea"); ta.rows = 8; ta.style.cssText = "margin-top:8px;font-family:'DM Mono',monospace;font-size:14px";
    ta.placeholder = "4.25\n5\n?\n3.5";
    const row = el("div", "ctx-actions");
    const applyR = el("button", "", "Apply & Rate"), applyC = el("button", "primary", "Apply & Open Card");
    const run = goStudio => {
      const parsed = parseTransferBlock(ta.value);
      if(!parsed){ toast("Nothing valid to apply"); return; }
      let count = 0;
      if(parsed.kind === "scores"){
        parsed.scores.forEach((v, idx) => {
          if(v === undefined) return;
          if(idx >= a.songs.length && a.auto) a.songs.push({ n: "", s: v });
          else if(idx < a.songs.length) a.songs[idx].s = v;
          if(v !== null) count++;
        });
      }else if(parsed.kind === "album"){
        parsed.data.songs.forEach((inc, idx) => {
          if(idx < a.songs.length){ a.songs[idx].s = inc.s; if(!a.songs[idx].n && inc.n) a.songs[idx].n = inc.n; }
          else a.songs.push({ n: inc.n, s: inc.s });
          if(inc.s !== null) count++;
        });
      }
      if(a.auto) ensurePending(a);
      touchAlbum(a); setActiveTrack(a, nextOpenIdx(a, -1));
      if(goStudio) db.view = "studio";
      saveDB(); closeModal(); render(); toast(`Applied ${count} score(s)`);
    };
    applyR.onclick = () => run(false); applyC.onclick = () => run(true);
    row.appendChild(applyR); row.appendChild(applyC);
    mod.appendChild(ta); mod.appendChild(row);
    setTimeout(() => ta.focus(), 40);
  });
}

  };

  manBtn.onclick = () => { manPanel.style.display = manPanel.style.display === "none" ? "grid" : "none"; };
  box.appendChild(ctx); box.appendChild(status); box.appendChild(candWrap); box.appendChild(manPanel);
  wrap.appendChild(box);

  async function handlePickedFiles(files, hint = ""){
    if(!files || !files.length) return;
    status.className = "status-msg"; status.textContent = "Reading audio tags locally…";
    const parsed = await parseDroppedFiles(files, hint);
    if(!parsed){ status.className = "status-msg err"; status.textContent = "No supported audio files found."; return; }
    importOrMergeAlbum(parsed, false); render();
    toast(`Loaded ${parsed.songs.length} tracks${parsed.cover ? " + cover" : ""}`);
  }
  foldIn.onchange = () => handlePickedFiles(foldIn.files);
  filesIn.onchange = () => handlePickedFiles(filesIn.files);

  async function runOnlineSearch(query){
    status.className = "status-msg"; status.textContent = "Searching MusicBrainz & iTunes…"; candWrap.innerHTML = "";
    try{
      const sr = await searchAlbumsOnline(query);
      if(!sr.results.length){ status.className = "status-msg err"; status.textContent = "Album not found. Check spelling or use Manual."; return; }
      searchMeta = sr; searchResults = sr.results.slice(0, 6);
      const [a, b] = sr.results;
      const ambig = b && b.score >= a.score - 0.03 && norm(b.artist) !== norm(a.artist);
      if(a.score >= 0.82 && !ambig) await pickOnlineCandidate(a);
      else{ status.textContent = "Select the matching release:"; drawCandidates(); }
    }catch(e){ status.className = "status-msg err"; status.textContent = e.message || "Search failed (offline?)."; }
  }
  async function pickOnlineCandidate(p){
    status.className = "status-msg"; status.textContent = "Loading tracklist & cover…";
    const tr = await loadReleaseTracks(p);
    if(!tr){ status.className = "status-msg err"; status.textContent = "Could not load tracklist."; return; }
    const cover = searchMeta.spCover || await findBestCover({ mbid: p.src === "mb" ? p.id : "", rgid: p.rgid, known: p.cover, artist: p.artist, album: p.album, cands: searchMeta.cands, raw: searchMeta.qRaw });
    importOrMergeAlbum({ artist: p.artist, album: p.album, year: tr.year || p.year || "", cover, auto: false, songs: tr.tracks.map(n => ({ n, s: null })) }, false);
    searchResults = []; searchMeta = null; render();
  }
  function drawCandidates(){
    candWrap.innerHTML = "";
    searchResults.forEach(c => {
      const b = el("button", "cand");
      if(c.cover){ const im = el("img"); im.src = c.cover; b.appendChild(im); } else b.appendChild(el("div", "ph"));
      const inf = el("div", "cand-info");
      inf.appendChild(el("div", "cand-t", c.album));
      inf.appendChild(el("div", "cand-s", `${c.artist}${c.year ? " · " + c.year : ""}${c.count ? " · " + c.count + " tracks" : ""}`));
      b.onclick = () => pickOnlineCandidate(c);
      b.appendChild(inf); candWrap.appendChild(b);
    });
  }

  inp.oninput = () => {
    ctx.innerHTML = ""; status.textContent = ""; candWrap.innerHTML = "";
    const parsed = parseTransferBlock(inp.value); if(!parsed) return;
    if(parsed.kind === "single"){
      const bS = el("button", "primary", "Search Online"); bS.onclick = () => runOnlineSearch(parsed.line);
      const bB = el("button", "", "Start Blind (No Tracklist)"); bB.onclick = () => { const sp = splitArtistAlbum(parsed.line); importOrMergeAlbum({ artist: sp.artist, album: sp.album || parsed.line, year: sp.year, auto: true, songs: [] }, false); render(); };
      ctx.appendChild(bS); ctx.appendChild(bB);
    }else if(parsed.kind === "album"){
      const bGo = el("button", "primary", parsed.hasScores ? "Import & Open Card" : "Open Album");
      bGo.onclick = () => { importOrMergeAlbum(parsed.data, parsed.hasScores); render(); };
      ctx.appendChild(bGo);
    }else if(parsed.kind === "backup"){
      const bImp = el("button", "primary", `Import Backup (${parsed.data.albums.length} albums)`);
      bImp.onclick = () => {
        const have = new Set(db.albums.map(x => x.id)); let n = 0;
        parsed.data.albums.forEach(x => { if(x && Array.isArray(x.songs) && !have.has(x.id)){ x.updatedAt = x.updatedAt || Date.now(); db.albums.push(x); n++; } });
        saveDB(); inp.value = ""; render(); toast(`Imported ${n} album(s)`);
      };
      ctx.appendChild(bImp);
    }else if(parsed.kind === "scores"){
      status.textContent = "Detected raw scores — open an album below and tap 📋 to paste scores onto it.";
    }
  };

  if(db.albums.length){
    wrap.appendChild(el("div", "sec-lbl", `Library (${db.albums.length})`));
    db.albums.slice().reverse().forEach(a => {
      const st = calcStat(a), row = el("div", "alb-item"), clk = el("div", "alb-click");
      const th = el("img", "alb-thumb"); th.src = a.cover || makePlaceholderCover(a.album);
      const mt = el("div", "alb-meta");
      mt.appendChild(el("div", "alb-title", formatAlbumTitle(a, db.settings.showYear)));
      mt.appendChild(el("div", "alb-sub", `${st.rated}/${st.total} rated · avg ${st.avg}`));
      clk.appendChild(th); clk.appendChild(mt);
      clk.onclick = () => { db.openId = a.id; db.view = "rate"; saveDB(false); render(); };

      const btns = el("div", "alb-btns");
      const cardB = el("button", "icon-btn", "✦ Card");
      cardB.onclick = e => { e.stopPropagation(); db.openId = a.id; db.view = "studio"; saveDB(false); render(); };
      const delB = el("button", "ghost");
      armBtn(delB, "Delete", () => {
        db.deleted.push({ id: a.id, at: Date.now() });
        db.albums = db.albums.filter(x => x.id !== a.id);
        if(db.openId === a.id) db.openId = null;
        saveDB(); render();
      });
      btns.appendChild(cardB); btns.appendChild(delB);
      row.appendChild(clk); row.appendChild(btns); wrap.appendChild(row);
    });
  }

  app.appendChild(wrap);
  window._dropHandler = handlePickedFiles;
}

/* ═════════════ RATING VIEW ═════════════ */
function renderRate(){
  const a = curAlbum(); if(!a){ db.view = "home"; return renderHome(); }
  document.body.classList.remove("studio-mode", "clean-shot");
  ensurePending(a);
  if(activeTrack < 0 || activeTrack >= a.songs.length) setActiveTrack(a, nextOpenIdx(a, -1));

  app.innerHTML = "";
  const wrap = el("div", "wrap");

  const tb = el("div", "topbar");
  const backB = el("button", "icon-btn", "← Library");
  backB.onclick = () => { db.openId = null; db.view = "home"; saveDB(false); render(); };
  const ta = el("div", "top-actions");
  const syncB = mkSyncButton(); if(syncB) ta.appendChild(syncB);
  const covB = el("button", "icon-btn", "🖼 Cover"); covB.onclick = () => openCoverModal(a);
  const pstB = el("button", "icon-btn", "📋 Scores"); pstB.onclick = () => openPasteScoresModal(a);
  const shrB = el("button", "icon-btn", "📤 Share"); shrB.onclick = () => openShareModal(a);
  const setB = el("button", "icon-btn", "⚙"); setB.onclick = openSettingsModal;
  ta.appendChild(covB); ta.appendChild(pstB); ta.appendChild(shrB); ta.appendChild(setB);
  tb.appendChild(backB); tb.appendChild(ta); wrap.appendChild(tb);

  const hd = el("div", "rate-head");
  const th = el("img", "alb-thumb"); th.src = a.cover || makePlaceholderCover(a.album); th.onclick = () => openCoverModal(a);
  const inf = el("div", "rate-info"); inf.onclick = () => openEditModal(a);
  if(a.artist) inf.appendChild(el("div", "rate-artist", a.artist + (a.year ? ` · ${a.year}` : "")));
  inf.appendChild(el("div", "rate-album", a.album || "Untitled Album"));
  const edB = el("button", "ghost", "✎ Edit"); edB.onclick = () => openEditModal(a);
  hd.appendChild(th); hd.appendChild(inf); hd.appendChild(edB); wrap.appendChild(hd);

  if(!a.auto){
    const bar = el("div", "rate-add-bar");
    const addIn = el("input"); addIn.type = "text"; addIn.placeholder = "Quick add track…";
    const addB = el("button", "", "Add");
    const doAdd = () => {
      const v = cleanTrackLine(addIn.value); if(!v) return;
      a.songs.push({ n: v, s: null }); touchAlbum(a);
      if(activeTrack < 0) setActiveTrack(a, a.songs.length - 1);
      saveDB(); renderRate();
      const nx = app.querySelector(".rate-add-bar input"); if(nx) nx.focus();
    };
    addB.onclick = doAdd; addIn.onkeydown = e => { if(e.key === "Enter") doAdd(); };
    bar.appendChild(addIn); bar.appendChild(addB); wrap.appendChild(bar);
  }

  const listWrap = el("div"), avgNode = el("div", "foot-avg");
  function updFoot(){
    const st = calcStat(a); avgNode.innerHTML = "";
    const left = el("span"); left.appendChild(document.createTextNode("Avg: ")); left.appendChild(el("b", "", st.avg));
    const right = el("span", "", `${st.scored} scored${st.ungraded ? " · " + st.ungraded + " (?)" : ""}${st.left ? " · " + st.left + " left" : ""}`);
    avgNode.appendChild(left); avgNode.appendChild(right);
  }
  function finishScore(idx){
    ensurePending(a); touchAlbum(a); setActiveTrack(a, nextOpenIdx(a, idx)); saveDB(); drawList(true);
  }
  function buildTrackCard(idx){
    const s = a.songs[idx], nm = s.n || `Track ${idx + 1}`, isAct = idx === activeTrack;
    const d = el("div", "t-card" + (s.s === null ? " un" : "") + (isAct ? " act" : "")); d.id = "tr" + idx;
    if(!isAct){
      d.className += " cl";
      const lf = el("div", "t-left"); lf.appendChild(el("span", "t-idx", idx + 1)); lf.appendChild(el("span", "t-nm", nm));
      d.appendChild(lf); d.appendChild(el("span", "t-bdg", fmtScore(s.s)));
      d.onclick = () => { setActiveTrack(a, idx); drawList(true); };
      return d;
    }
    const top = el("div", "t-act-top"), lf = el("div", "t-left");
    lf.appendChild(el("span", "t-idx", idx + 1)); lf.appendChild(el("span", "t-nm", nm));
    const acts = el("div"); acts.style.cssText = "display:flex;gap:2px";
    const renB = el("button", "ghost", "✎"); renB.title = "Rename";
    renB.onclick = () => { const nv = prompt("Track name:", s.n); if(nv !== null){ s.n = nv.trim(); touchAlbum(a); saveDB(); drawList(false); } };
    const rmB = el("button", "ghost", "✕"); rmB.title = "Remove";
    rmB.onclick = () => { a.songs.splice(idx, 1); ensurePending(a); touchAlbum(a); setActiveTrack(a, nextOpenIdx(a, idx - 1)); saveDB(); drawList(true); };
    acts.appendChild(renB); acts.appendChild(rmB); top.appendChild(lf); top.appendChild(acts); d.appendChild(top);

    const redo = () => { listWrap.replaceChild(buildTrackCard(idx), d); updFoot(); };
    if(baseScore === null){
      const w = typeof s.s === "number" ? Math.floor(s.s) : null, k1 = el("div", "kpad1");
      [0, 1, 2, 3, 4, 5, "?"].forEach(v => {
        const b = el("button", (v === "?" ? s.s === "?" : w === v) ? "on" : "", String(v));
        b.onclick = () => { a.songs[idx].s = v; if(v === 5 || v === "?") finishScore(idx); else{ baseScore = v; touchAlbum(a); saveDB(); redo(); } };
        k1.appendChild(b);
      });
      d.appendChild(k1);
    }else{
      const k2 = el("div", "kpad2"), bk = el("button", "bk", "←");
      bk.onclick = () => { baseScore = null; redo(); };
      k2.appendChild(bk);
      [0, 0.25, 0.5, 0.75].forEach(f => {
        const val = baseScore + f, b = el("button", s.s === val ? "on" : "", String(val));
        b.onclick = () => { a.songs[idx].s = val; finishScore(idx); };
        k2.appendChild(b);
      });
      d.appendChild(k2);
    }
    return d;
  }
  function drawList(scroll){
    listWrap.innerHTML = ""; a.songs.forEach((_, i) => listWrap.appendChild(buildTrackCard(i))); updFoot();
    if(scroll){ const elR = activeTrack >= 0 && document.getElementById("tr" + activeTrack); if(elR) elR.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  }
  wrap.appendChild(listWrap);

  const foot = el("div", "foot"), fin = el("div", "foot-in"), fbtns = el("div", "foot-btns");
  const cpTr = el("button", "", "Copy Transfer"); cpTr.onclick = () => copyText(buildTransferText(a), "Copied for transfer");
  fbtns.appendChild(cpTr);
  if(a.auto){
    const finB = el("button", "", "Finish List");
    finB.onclick = () => { while(a.songs.length && a.songs[a.songs.length - 1].s === null) a.songs.pop(); a.auto = false; touchAlbum(a); setActiveTrack(a, -1); saveDB(); renderRate(); };
    fbtns.appendChild(finB);
  }
  const stB = el("button", "primary", "Card Studio →");
  stB.onclick = () => { while(a.songs.length && a.auto && a.songs[a.songs.length - 1].s === null && !a.songs[a.songs.length - 1].n) a.songs.pop(); a.auto = false; db.view = "studio"; saveDB(false); render(); };
  fbtns.appendChild(stB); fin.appendChild(avgNode); fin.appendChild(fbtns); foot.appendChild(fin);
  app.appendChild(wrap); app.appendChild(foot);
  drawList(false);
}

/* ═════════════ CARD BUILDER (14 LAYOUTS × 36 THEMES × 6 HIGHLIGHT MODES) ═════════════ */
function buildCardDOM(a, theme){
  const s = db.settings, st = calcStat(a), lay = s.cardLayout || "side";
  const hlOn = !!s.highlightEnabled, hlMode = s.highlightStyle || "spotlight";
  const hlCls = hlOn && hlMode !== "grouped" ? ` hl-${hlMode}` : "";
  const root = el("div", `card-root lay-${lay}${hlCls}`);
  Object.entries(theme.vars).forEach(([k, v]) => root.style.setProperty(k, v));

  const coverSrc = a.cover || makePlaceholderCover(a.album);
  const cleanSongs = a.songs.filter(x => !(a.auto && x.s === null && !x.n)).map((x, i) => ({ idx: i + 1, n: x.n || `Track ${i + 1}`, s: x.s }));
  const displaySongs = s.sortMode === "score"
    ? [...cleanSongs].sort((x, y) => ((typeof y.s === "number" ? y.s : -1) - (typeof x.s === "number" ? x.s : -1)) || (x.idx - y.idx))
    : cleanSongs;

  const isHi = val => hlOn && typeof val === "number" && val >= (Number(s.highlightThreshold) || 3.5);

  function mkHeader(stacked){
    const yr = (s.showYear && a.year) ? `(${a.year})` : "";
    if(stacked){
      const box = el("div");
      if(a.artist) box.appendChild(el("div", "c-artist", a.artist));
      const h = el("div", "c-album c-disp", a.album || "Untitled Album");
      if(yr) h.appendChild(el("span", "c-year", yr));
      box.appendChild(h); return box;
    }
    const h = el("div", "c-header-inline c-disp");
    if(a.artist){ h.appendChild(el("span", "art", a.artist)); h.appendChild(el("span", "sep", "—")); }
    h.appendChild(el("span", "", a.album || "Untitled Album"));
    if(yr) h.appendChild(el("span", "yr", yr));
    return h;
  }

  function mkAvgBox(lbl = "Average"){
    const b = el("div", "c-avg-box");
    b.appendChild(el("span", "c-avg-lbl", lbl));
    b.appendChild(el("span", "c-avg-val", st.avg));
    return b;
  }

  function mkTrackRow(item, mode){
    const hi = isHi(item.s), rowCls = "t-row" + (hlOn ? (hi ? " hi" : " dim") : "");
    const r = el("div", rowCls), col = getScoreColor(item.s, theme), scTxt = fmtScore(item.s);

    if(mode === "digits"){
      const sc = el("span", "t-score", scTxt); sc.style.color = col;
      const mid = el("div", "dig-mid"), top = el("div"); top.style.cssText = "display:flex;align-items:center;gap:7px";
      top.appendChild(el("span", "t-num", String(item.idx).padStart(2, "0")));
      top.appendChild(el("span", "t-title", item.n));
      if(hi && hlMode === "stripeTag") top.appendChild(el("span", "t-pick", "PICK"));
      const ln = el("div", "dig-line"), fl = el("div");
      fl.style.width = (typeof item.s === "number" ? (item.s / 5) * 100 : 0) + "%"; fl.style.background = col;
      ln.appendChild(fl); mid.appendChild(top); mid.appendChild(ln);
      r.appendChild(sc); r.appendChild(mid); return r;
    }
    if(mode === "lined"){
      const dot = el("span", "dot"); dot.style.background = typeof item.s === "number" ? col : theme.vars["--c-border"];
      r.appendChild(dot); r.appendChild(el("span", "t-num", item.idx));
      r.appendChild(el("span", "t-title", item.n));
      if(hi && hlMode === "stripeTag") r.appendChild(el("span", "t-pick", "PICK"));
      const bw = el("div", "bar-wrap"), bf = el("div", "bar-fill");
      bf.style.width = (typeof item.s === "number" ? (item.s / 5) * 100 : 0) + "%"; bf.style.background = col;
      bw.appendChild(bf); r.appendChild(bw);
      const sc = el("span", "t-score", scTxt); sc.style.color = col; r.appendChild(sc);
      return r;
    }
    if(hi && hlMode === "scorePill") r.appendChild(el("span", "t-dot-hi"));
    r.appendChild(el("span", "t-num", item.idx));
    r.appendChild(el("span", "t-title", item.n));
    if(hi && hlMode === "stripeTag") r.appendChild(el("span", "t-pick", "PICK"));
    const sc = el("span", "t-score", scTxt); sc.style.color = col; r.appendChild(sc);
    return r;
  }

  function appendTracks(container, items, mode){
    if(hlOn && hlMode === "grouped"){
      const rec = items.filter(x => isHi(x.s)), oth = items.filter(x => !isHi(x.s));
      if(rec.length){
        container.appendChild(el("div", "hl-grp-hd", `Recommended (≥ ${s.highlightThreshold})`));
        rec.forEach(x => container.appendChild(mkTrackRow(x, mode)));
      }
      if(oth.length){
        if(rec.length) container.appendChild(el("div", "hl-grp-hd muted", "Other Tracks"));
        oth.forEach(x => container.appendChild(mkTrackRow(x, mode)));
      }
      return;
    }
    items.forEach(x => container.appendChild(mkTrackRow(x, mode)));
  }

  function mkExtras(){
    if(!s.showBestTrack && !s.showDistribution && !s.showDate && !(s.showNote && a.note)) return null;
    const ex = el("div", "c-extras");
    if(s.showNote && a.note) ex.appendChild(el("div", "c-note", `“${a.note}”`));
    if(s.showBestTrack){
      const best = cleanSongs.filter(x => typeof x.s === "number").sort((x, y) => y.s - x.s)[0];
      if(best){ const sp = el("span"); sp.appendChild(document.createTextNode("Top: ")); sp.appendChild(el("b", "", `${best.n} (${fmtScore(best.s)})`)); ex.appendChild(sp); }
    }
    if(s.showDistribution){
      const nums = cleanSongs.filter(x => typeof x.s === "number").map(x => x.s);
      if(nums.length){
        const bar = el("div", "c-dist");
        [[4.5,5.1],[3.5,4.5],[2.5,3.5],[1.5,2.5],[0,1.5]].forEach(([mn, mx]) => {
          const cnt = nums.filter(v => v >= mn && v < mx).length;
          if(cnt){ const seg = el("span"); seg.style.width = Math.max(8, Math.round((cnt / nums.length) * 90)) + "px"; seg.style.background = getScoreColor(mn === 0 ? 1 : mn, theme); bar.appendChild(seg); }
        });
        ex.appendChild(bar);
      }
    }
    if(s.showDate) ex.appendChild(el("span", "", new Date(a.createdAt || Date.now()).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" })));
    return ex;
  }

  const mkImg = () => { const i = el("img", "c-cover"); i.src = coverSrc; if(!coverSrc.startsWith("data:")) i.crossOrigin = "anonymous"; i.alt = a.album; return i; };
  let targetContainer = root;

  if(lay === "side"){
    const g = el("div", "s-grid"), lf = el("div", "s-left"), rt = el("div", "s-list");
    lf.appendChild(mkImg()); lf.appendChild(mkHeader(true)); lf.appendChild(mkAvgBox("Average"));
    appendTracks(rt, displaySongs); g.appendChild(lf); g.appendChild(rt); root.appendChild(g);
  }
  else if(lay === "center"){
    const top = el("div", "cen-top"); top.appendChild(mkImg()); top.appendChild(mkHeader(true)); root.appendChild(top);
    const list = el("div", "cen-list"); appendTracks(list, displaySongs); root.appendChild(list);
    const ft = el("div", "cen-foot"); ft.appendChild(mkAvgBox("Average")); root.appendChild(ft);
  }
  else if(lay === "showcase"){
    const g = el("div", "sh-grid"), lf = el("div", "sh-left"), rt = el("div", "sh-right"), trs = el("div", "sh-tracks");
    lf.appendChild(mkImg());
    const meta = el("div", "sh-meta"); meta.appendChild(mkHeader(true)); lf.appendChild(meta);
    appendTracks(trs, displaySongs);
    rt.appendChild(trs); rt.appendChild(mkAvgBox("Average"));
    g.appendChild(lf); g.appendChild(rt); root.appendChild(g);
  }
  else if(lay === "minimal"){
    const hd = el("div", "min-hd"); hd.appendChild(mkImg());
    const meta = el("div", "min-meta"); meta.appendChild(mkHeader(true));
    const av = el("div", "min-avg"); av.appendChild(el("span", "c-avg-lbl", "Average")); av.appendChild(el("span", "c-avg-val", st.avg));
    meta.appendChild(av); hd.appendChild(meta); root.appendChild(hd);
    appendTracks(root, displaySongs);
  }
  else if(lay === "lined"){
    const hd = el("div", "lin-hd"); hd.appendChild(mkImg());
    const meta = el("div", "lin-meta"); meta.appendChild(mkHeader(true)); meta.appendChild(mkAvgBox("Average"));
    hd.appendChild(meta); root.appendChild(hd);
    appendTracks(root, displaySongs, "lined");
  }
  else if(lay === "digits"){
    const hd = el("div", "dig-hd"); hd.appendChild(mkImg());
    const meta = el("div", "dig-meta"); meta.appendChild(mkHeader(true)); meta.appendChild(mkAvgBox("Average"));
    hd.appendChild(meta); root.appendChild(hd);
    appendTracks(root, displaySongs, "digits");
  }
  else if(lay === "split"){
    const hd = el("div", "sp-hd"); hd.appendChild(mkImg());
    const inf = el("div", "sp-hd-info"); inf.appendChild(mkHeader(true)); inf.appendChild(mkAvgBox("Average"));
    hd.appendChild(inf); root.appendChild(hd);
    const half = Math.ceil(displaySongs.length / 2), cols = el("div", "sp-cols"), c1 = el("div"), c2 = el("div");
    appendTracks(c1, displaySongs.slice(0, half)); appendTracks(c2, displaySongs.slice(half));
    cols.appendChild(c1); cols.appendChild(c2); root.appendChild(cols);
  }
  else if(lay === "splitSide"){
    const g = el("div", "ss-grid"), lf = el("div", "ss-left"), cols = el("div", "ss-cols");
    lf.appendChild(mkImg()); lf.appendChild(mkHeader(true)); lf.appendChild(mkAvgBox("Average"));
    if(hlOn && hlMode === "grouped"){
      const wrapCol = el("div"); appendTracks(wrapCol, displaySongs); g.appendChild(lf); g.appendChild(wrapCol);
    }else{
      displaySongs.forEach(x => cols.appendChild(mkTrackRow(x)));
      g.appendChild(lf); g.appendChild(cols);
    }
    root.appendChild(g);
  }
  else if(lay === "poster"){
    const hero = el("div", "pos-hero"); hero.appendChild(mkImg());
    const meta = el("div", "pos-meta"); meta.appendChild(mkHeader(true));
    const stamp = el("div", "pos-stamp"); stamp.appendChild(el("span", "c-avg-lbl", "Average")); stamp.appendChild(el("span", "c-avg-val", st.avg));
    meta.appendChild(stamp); hero.appendChild(meta); root.appendChild(hero);
    const body = el("div", "pos-body");
    if(hlOn && hlMode === "grouped"){ appendTracks(body, displaySongs); }
    else{ const grid = el("div", "pos-grid" + (displaySongs.length >= 11 ? " two" : "")); displaySongs.forEach(x => grid.appendChild(mkTrackRow(x))); body.appendChild(grid); }
    root.appendChild(body); targetContainer = body;
  }
  else if(lay === "liner"){
    const top = el("div", "ln-top"); top.appendChild(mkImg());
    const kv = el("div", "ln-kv");
    const mkKv = (k, v, ac) => { const d = el("div"); d.appendChild(el("span", "ln-k", k)); d.appendChild(el("span", "ln-v" + (ac ? " ac" : ""), v)); return d; };
    kv.appendChild(mkKv("ARTIST", a.artist || "—", true));
    kv.appendChild(mkKv("ALBUM", a.album || "Untitled"));
    if(s.showYear && a.year) kv.appendChild(mkKv("YEAR", a.year));
    kv.appendChild(mkKv("AVERAGE", st.avg, true));
    top.appendChild(kv); root.appendChild(top);
    appendTracks(root, displaySongs);
  }
  else if(lay === "bento"){
    const top = el("div", "ben-top"), tCov = el("div", "ben-cover"); tCov.appendChild(mkImg());
    const side = el("div", "ben-side");
    const tMeta = el("div", "ben-tile"); tMeta.appendChild(mkHeader(true));
    const tAvg = el("div", "ben-tile ben-avg"); tAvg.appendChild(el("span", "c-avg-lbl", "Average")); tAvg.appendChild(el("span", "c-avg-val", st.avg));
    side.appendChild(tMeta); side.appendChild(tAvg);
    top.appendChild(tCov); top.appendChild(side); root.appendChild(top);
    if(hlOn && hlMode === "grouped"){
      const wrapB = el("div", "ben-tile"); appendTracks(wrapB, displaySongs); root.appendChild(wrapB);
    }else{
      const trBox = el("div", "ben-tracks"); displaySongs.forEach(x => trBox.appendChild(mkTrackRow(x))); root.appendChild(trBox);
    }
  }
  else if(lay === "compact"){
    const top = el("div", "cmp-top"); top.appendChild(mkImg()); top.appendChild(mkHeader(true)); top.appendChild(mkAvgBox("Average"));
    root.appendChild(top); appendTracks(root, displaySongs);
  }
  else if(lay === "atmo"){
    const bg = el("img", "atmo-bg"); bg.src = coverSrc; if(!coverSrc.startsWith("data:")) bg.crossOrigin = "anonymous";
    const scrim = el("div", "atmo-scrim"); scrim.style.background = theme.isLight ? "rgba(250,249,246,0.78)" : "rgba(10,12,18,0.70)";
    const inner = el("div", "atmo-in");
    const hd = el("div", "atmo-hd"); hd.appendChild(mkImg());
    const meta = el("div", "atmo-meta"); meta.appendChild(mkHeader(true)); meta.appendChild(mkAvgBox("Average"));
    hd.appendChild(meta); inner.appendChild(hd);
    if(hlOn && hlMode === "grouped"){ appendTracks(inner, displaySongs); }
    else{ const list = el("div", "atmo-list" + (displaySongs.length >= 12 ? " two" : "")); displaySongs.forEach(x => list.appendChild(mkTrackRow(x))); inner.appendChild(list); }
    root.appendChild(bg); root.appendChild(scrim); root.appendChild(inner); targetContainer = inner;
  }
  else if(lay === "gallery"){
    const hero = el("div", "gal-hero"); hero.appendChild(mkImg());
    const bar = el("div", "gal-bar"); bar.appendChild(mkHeader(false)); bar.appendChild(mkAvgBox("AVG"));
    hero.appendChild(bar); root.appendChild(hero);
    if(hlOn && hlMode === "grouped"){ appendTracks(root, displaySongs); }
    else{ const cols = el("div", "gal-cols"); displaySongs.forEach(x => cols.appendChild(mkTrackRow(x))); root.appendChild(cols); }
  }

  const ex = mkExtras();
  if(ex) targetContainer.appendChild(ex);
  return root;
}

/* ═════════════ STUDIO VIEW ═════════════ */
function renderStudio(){
  const a = curAlbum(); if(!a){ db.view = "home"; return renderHome(); }
  document.body.classList.add("studio-mode");
  document.body.classList.toggle("clean-shot", cleanShot);
  app.innerHTML = "";

  const wrap = el("div", "wrap wide");
  if(cleanShot){
    const ex = el("button", "clean-exit", "Exit Clean View (Esc)");
    ex.onclick = () => { cleanShot = false; renderStudio(); };
    app.appendChild(ex);
  }

  const tb = el("div", "topbar hide-clean");
  const left = el("div", "top-actions");
  const bRate = el("button", "icon-btn", "← Rate"); bRate.onclick = () => { cleanShot = false; db.view = "rate"; saveDB(false); render(); };
  const bLib = el("button", "icon-btn", "Library"); bLib.onclick = () => { cleanShot = false; db.openId = null; db.view = "home"; saveDB(false); render(); };
  left.appendChild(bRate); left.appendChild(bLib);

  const right = el("div", "top-actions");
  const syncB = mkSyncButton(); if(syncB) right.appendChild(syncB);
  const bCov = el("button", "icon-btn", "🖼 Cover"); bCov.onclick = () => openCoverModal(a);
  const bClean = el("button", "icon-btn", "⛶ Clean View"); bClean.onclick = () => { cleanShot = true; renderStudio(); };

  const ratioSel = el("select", "compact-sel");
  [["auto","PNG: Auto"],["portrait","PNG: Portrait 9:16"],["square","PNG: Square 1:1"],["post","PNG: Post 4:5"],["wide","PNG: Wide 16:9"]].forEach(([v,t]) => {
    const o = el("option", "", t); o.value = v; ratioSel.appendChild(o);
  });
  ratioSel.value = db.settings.pngRatio || "auto";
  ratioSel.onchange = () => { db.settings.pngRatio = ratioSel.value; saveDB(false); };

  const bPng = el("button", "icon-btn", "↓ Save PNG");
  bPng.onclick = async () => {
    bPng.disabled = true; toast("Rendering PNG…");
    try{
      const blob = await renderCardPngBlob(a), url = URL.createObjectURL(blob), lk = document.createElement("a");
      lk.href = url; lk.download = `${(a.artist ? a.artist + " - " : "") + (a.album || "album")}.png`.replace(/[\\/:*?"<>|]/g, "_");
      lk.click(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast("PNG saved");
    }catch(e){ toast(e.message === "CORS" ? "Cover host blocks PNG — upload cover or use Clean View" : "PNG export failed"); }
    bPng.disabled = false;
  };
  const bCpImg = el("button", "icon-btn", "Copy PNG");
  bCpImg.onclick = async () => {
    if(!navigator.clipboard || !window.ClipboardItem){ toast("Copy PNG unsupported — use Save PNG"); return; }
    bCpImg.disabled = true; toast("Rendering PNG…");
    try{
      const blob = await renderCardPngBlob(a);
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      toast("Image copied");
    }catch(e){ toast("Copy failed — use Save PNG or Clean View"); }
    bCpImg.disabled = false;
  };
  const bSet = el("button", "icon-btn", "⚙"); bSet.onclick = openSettingsModal;
  right.appendChild(bCov); right.appendChild(bClean); right.appendChild(ratioSel); right.appendChild(bPng); right.appendChild(bCpImg); right.appendChild(bSet);
  tb.appendChild(left); tb.appendChild(right); wrap.appendChild(tb);

  const stage = el("div", "studio-stage"); stage.id = "card-stage";
  if(cleanShot) stage.onclick = e => { if(e.target === stage){ cleanShot = false; renderStudio(); } };

  let theme = CARD_THEMES.find(t => t.id === db.settings.cardTheme) || CARD_THEMES[1];
  stage.appendChild(buildCardDOM(a, theme));
  wrap.appendChild(stage);

  if(theme.id === "coverMatch" && a.cover){
    extractCoverPalette(a.cover).then(pal => {
      if(pal && db.view === "studio" && db.settings.cardTheme === "coverMatch"){
        stage.innerHTML = ""; stage.appendChild(buildCardDOM(a, pal));
      }
    });
  }

  const panel = el("div", "studio-panel hide-clean");
  const tabs = el("div", "studio-tabs"), pills = el("div", "tab-pills");
  const pLay = el("button", studioTab === "layout" ? "active" : "", `Layout (${CARD_LAYOUTS.length})`);
  const pThm = el("button", studioTab === "theme" ? "active" : "", `Theme (${CARD_THEMES.length})`);
  pLay.onclick = () => { studioTab = "layout"; renderStudio(); };
  pThm.onclick = () => { studioTab = "theme"; renderStudio(); };
  pills.appendChild(pLay); pills.appendChild(pThm);

  const qActs = el("div", "top-actions");
  const rndB = el("button", "icon-btn", "✦ Random");
  rndB.onclick = () => {
    const pool = studioTab === "layout" ? CARD_LAYOUTS : CARD_THEMES, key = studioTab === "layout" ? "cardLayout" : "cardTheme";
    let pick; do{ pick = pool[Math.floor(Math.random() * pool.length)].id; }while(pick === db.settings[key] && pool.length > 1);
    db.settings[key] = pick; saveDB(false); renderStudio();
  };
  const nxtB = el("button", "icon-btn", "Next →");
  nxtB.onclick = () => {
    const pool = studioTab === "layout" ? CARD_LAYOUTS : CARD_THEMES, key = studioTab === "layout" ? "cardLayout" : "cardTheme";
    const i = pool.findIndex(x => x.id === db.settings[key]);
    db.settings[key] = pool[(i + 1) % pool.length].id; saveDB(false); renderStudio();
  };
  qActs.appendChild(rndB); qActs.appendChild(nxtB);
  tabs.appendChild(pills); tabs.appendChild(qActs); panel.appendChild(tabs);

  if(studioTab === "layout"){
    const lg = el("div", "lay-grid");
    CARD_LAYOUTS.forEach(l => {
      const b = el("button", "lay-btn" + (db.settings.cardLayout === l.id ? " active" : ""));
      b.appendChild(el("span", "lay-ico", l.icon)); b.appendChild(el("span", "", l.name));
      b.onclick = () => { db.settings.cardLayout = l.id; saveDB(false); renderStudio(); };
      lg.appendChild(b);
    });
    panel.appendChild(lg);
  }else{
    const tg = el("div", "th-grid");
    CARD_THEMES.forEach(t => {
      const b = el("button", "th-btn" + (db.settings.cardTheme === t.id ? " active" : ""));
      const dot = el("span", "th-dot"); dot.style.background = t.dot;
      b.appendChild(dot); b.appendChild(el("span", "", t.name));
      b.onclick = () => { db.settings.cardTheme = t.id; saveDB(false); renderStudio(); };
      tg.appendChild(b);
    });
    panel.appendChild(tg);
  }
  wrap.appendChild(panel);
  app.appendChild(wrap);
}

/* ═════════════ DRAG/DROP, HASH BOOT & SHORTCUTS ═════════════ */
let dragDepth = 0;
const overlay = document.getElementById("drag-overlay");
window.addEventListener("dragenter", e => { if(e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")){ dragDepth++; overlay.classList.add("show"); } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if(!dragDepth) overlay.classList.remove("show"); });
window.addEventListener("drop", async e => {
  e.preventDefault(); dragDepth = 0; overlay.classList.remove("show");
  const dt = e.dataTransfer; if(!dt) return;
  const { files, folderHint } = await collectFilesFromDT(dt);
  if(files.length){
    toast("Reading audio tags…", 1800);
    const parsed = await parseDroppedFiles(files, folderHint);
    if(!parsed){ toast("No audio files found in drop"); return; }
    importOrMergeAlbum(parsed, false); render();
    toast(`Loaded ${parsed.songs.length} tracks${parsed.cover ? " + cover" : ""}`);
  }
});

document.addEventListener("keydown", e => {
  if(document.querySelector(".modal-bg")){ if(e.key === "Escape") closeModal(); return; }
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

  if(db.view === "studio"){
    if(e.key === "Escape" && cleanShot){ cleanShot = false; renderStudio(); }
    else if(e.key === "ArrowRight"){ const i = CARD_THEMES.findIndex(x => x.id === db.settings.cardTheme); db.settings.cardTheme = CARD_THEMES[(i+1)%CARD_THEMES.length].id; saveDB(false); renderStudio(); }
    else if(e.key === "ArrowLeft"){ const i = CARD_THEMES.findIndex(x => x.id === db.settings.cardTheme); db.settings.cardTheme = CARD_THEMES[(i-1+CARD_THEMES.length)%CARD_THEMES.length].id; saveDB(false); renderStudio(); }
    return;
  }
  if(db.view === "rate"){
    const a = curAlbum(); if(!a || activeTrack < 0 || !a.songs[activeTrack]) return;
    if(e.key === "ArrowDown" && activeTrack < a.songs.length - 1){ e.preventDefault(); setActiveTrack(a, activeTrack + 1); renderRate(); return; }
    if(e.key === "ArrowUp" && activeTrack > 0){ e.preventDefault(); setActiveTrack(a, activeTrack - 1); renderRate(); return; }
    if(baseScore === null){
      if(/^[0-4]$/.test(e.key)){ a.songs[activeTrack].s = Number(e.key); baseScore = Number(e.key); touchAlbum(a); saveDB(); renderRate(); }
      else if(e.key === "5"){ a.songs[activeTrack].s = 5; ensurePending(a); touchAlbum(a); setActiveTrack(a, nextOpenIdx(a, activeTrack)); saveDB(); renderRate(); }
      else if(e.key === "?" || e.key.toLowerCase() === "q"){ a.songs[activeTrack].s = "?"; ensurePending(a); touchAlbum(a); setActiveTrack(a, nextOpenIdx(a, activeTrack)); saveDB(); renderRate(); }
    }else{
      const map = { "0": 0, "Enter": 0, " ": 0, "2": 0.25, "5": 0.5, "7": 0.75 };
      if(e.key === "Backspace" || e.key === "Escape"){ baseScore = null; renderRate(); }
      else if(map[e.key] !== undefined){ e.preventDefault(); a.songs[activeTrack].s = baseScore + map[e.key]; ensurePending(a); touchAlbum(a); setActiveTrack(a, nextOpenIdx(a, activeTrack)); saveDB(); renderRate(); }
    }
  }
});

function checkHashImport(){
  if(location.hash && location.hash.startsWith("#d=")){
    const data = tryParseLink(location.hash);
    if(data){
      importOrMergeAlbum(data, data.songs.some(s => s.s !== null));
      history.replaceState(null, "", location.pathname + location.search);
    }
  }
}

function render(){
  if(db.view === "studio" && curAlbum()) renderStudio();
  else if(db.view === "rate" && curAlbum()) renderRate();
  else{ db.view = "home"; renderHome(); }
}

loadDB();
applyUITheme();
checkHashImport();
render();
})();
</script>
